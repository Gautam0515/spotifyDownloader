services:
  - type: web
    name: spotify-downloader-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SPOTIPY_CLIENT_ID
        sync: false
      - key: SPOTIPY_CLIENT_SECRET
        sync: false
